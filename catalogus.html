<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definitiecatalogus Sociaal Domein</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --text-muted: #6b7280;
    --accent: #2454a8;
    --accent-light: #eaf1fb;
    --warn-bg: #fff4e5;
    --warn-border: #f0c36d;
    --warn-text: #92600c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 1.4rem;
  }
  header .counts {
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    border: none;
    background: none;
    padding: 12px 16px;
    font-size: 0.95rem;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  main {
    padding: 20px 28px;
    max-width: 1200px;
    margin: 0 auto;
  }
  #issue-banner {
    display: none;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 0.88rem;
  }
  .search-row {
    margin-bottom: 14px;
  }
  .search-row input {
    width: 100%;
    max-width: 360px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.92rem;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title {
    font-weight: 600;
    font-size: 1.02rem;
  }
  .badge {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .card-id {
    color: var(--text-muted);
    font-size: 0.8rem;
    font-family: ui-monospace, monospace;
  }
  .card-def {
    margin: 8px 0 0 0;
    white-space: pre-wrap;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .card-meta {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  details summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--accent);
    margin-top: 8px;
  }
  details .extra-content {
    white-space: pre-wrap;
    font-size: 0.88rem;
    margin-top: 6px;
    color: var(--text);
    background: var(--accent-light);
    padding: 10px 12px;
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:last-child td { border-bottom: none; }
  .cell-pre {
    white-space: pre-wrap;
    max-width: 360px;
  }
  .empty-state {
    color: var(--text-muted);
    padding: 40px;
    text-align: center;
  }
  .source-tag {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-left: 8px;
  }
  a.dash-link {
    color: var(--accent);
    text-decoration: none;
  }
  a.dash-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Definitiecatalogus Sociaal Domein</h1>
  <div class="counts" id="header-counts">Data wordt geladen…</div>
</header>

<nav>
  <button class="tab-btn active" data-tab="definities">Definities</button>
  <button class="tab-btn" data-tab="datavelden">Datavelden</button>
  <button class="tab-btn" data-tab="dashboards">Dashboards</button>
</nav>

<main>
  <div id="issue-banner"></div>

  <!-- DEFINITIES -->
  <div class="tab-panel active" id="panel-definities">
    <div class="search-row">
      <input type="text" id="search-definities" placeholder="Zoek op term, categorie, team…">
    </div>
    <div class="card-list" id="list-definities"></div>
  </div>

  <!-- DATAVELDEN -->
  <div class="tab-panel" id="panel-datavelden">
    <div class="search-row">
      <input type="text" id="search-datavelden" placeholder="Zoek op naam, kolom, bron…">
    </div>
    <table>
      <thead>
        <tr>
          <th>id</th><th>name</th><th>desc</th><th>type</th><th>src</th><th>col</th><th>values</th>
        </tr>
      </thead>
      <tbody id="table-datavelden"></tbody>
    </table>
  </div>

  <!-- DASHBOARDS -->
  <div class="tab-panel" id="panel-dashboards">
    <div class="card-list" id="list-dashboards"></div>
  </div>
</main>

<script>
/* ==================================================================
   CSV-PARSER
   Handgeschreven, ondersteunt quotes/komma's binnen cellen.
   Het nieuwe celformaat gebruikt GEEN echte newlines/JSON meer in
   cellen (zie hieronder), dus deze parser kan eenvoudig blijven: we
   hebben 'm niet meer per se nodig voor newlines-binnen-quotes, maar
   hij blijft een nuttige vangnet voor komma's in tekst.
   ================================================================== */
function parseCSV(text) {
  if (!text) return [];
  const rows = [];
  let row = [], field = '', inQuotes = false;
  let i = 0;
  const len = text.length;
  while (i < len) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i += 1; continue;
      }
      field += ch; i += 1; continue;
    }
    if (ch === '"') { inQuotes = true; i += 1; continue; }
    if (ch === ',') { row.push(field); field = ''; i += 1; continue; }
    if (ch === '\r') {
      if (text[i + 1] === '\n') i += 1;
      row.push(field); rows.push(row); row = []; field = ''; i += 1; continue;
    }
    if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i += 1; continue; }
    field += ch; i += 1;
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function parseCSVToRecords(text) {
  const rows = parseCSV(text);
  if (rows.length === 0) return [];
  const header = rows[0];
  const records = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const rec = {};
    for (let c = 0; c < header.length; c++) rec[header[c]] = row[c] !== undefined ? row[c] : '';
    records.push(rec);
  }
  return records;
}

/* ==================================================================
   CEL-FORMAAT
   Het nieuwe, simpele contract voor "lastige" cellen:
   - Meerregelige tekst (def, ctx, fields, notes, fieldsFull, desc,
     values) staat in de CSV als letterlijke "\n" (backslash + n) in
     plaats van een echte regeleinde-byte.
   - Geneste structuur (fieldChips, changelog) staat als JSON-achtige
     tekst MET ENKELE quotes i.p.v. dubbele (bv. [{'date': '...'}]),
     zodat er geen CSV-quote-conflict ontstaat. Bij het laden zetten
     we enkele quotes om naar dubbele en parsen we als JSON.
   Beide om dezelfde reden: voorkomen dat Google Sheets een cel met
   een echte newline of dubbele aanhalingstekens verkeerd importeert.
   ================================================================== */
function decodeText(value) {
  if (value == null) return '';
  return String(value).split('\\n').join('\n');
}

function decodeJsonField(value, fallback) {
  const v = (value || '').trim();
  if (!v) return fallback;
  try {
    return JSON.parse(v.replace(/'/g, '"'));
  } catch (err) {
    console.warn('JSON-veld kon niet gelezen worden, fallback gebruikt:', value, err);
    return fallback;
  }
}

/* ==================================================================
   DATASETS OPHALEN
   Vul hier de gepubliceerde CSV-URL's van de 3 Google Sheets-tabs in.
   Leeg laten (null) betekent: er is geen Sheets-koppeling, dan blijft
   de hardcoded fallback-data hieronder gebruikt.
   ================================================================== */
const SHEET_URLS = {
  definities: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqtLb8sAkrRePaCRjZSMVrqvC_lB3CEkUJ6S1MnfIFdzH-L7ABkSNAPuOaglIzR3mMVgABiAoBjIej/pub?gid=1044637075&single=true&output=csv',
  datavelden: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqtLb8sAkrRePaCRjZSMVrqvC_lB3CEkUJ6S1MnfIFdzH-L7ABkSNAPuOaglIzR3mMVgABiAoBjIej/pub?gid=574841714&single=true&output=csv',
  dashboards: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqtLb8sAkrRePaCRjZSMVrqvC_lB3CEkUJ6S1MnfIFdzH-L7ABkSNAPuOaglIzR3mMVgABiAoBjIej/pub?gid=1394577148&single=true&output=csv',
};

// Kleine hardcoded fallback zodat de pagina ook zonder Sheets-koppeling
// iets toont. Vervang/vul aan met de DEFAULT_*-data uit de bestaande
// app, of laat leeg als je altijd via Sheets laadt.
const FALLBACK = {
  definities: [],
  datavelden: [],
  dashboards: [],
};

const state = {
  definities: [],
  datavelden: [],
  dashboards: [],
};

const issues = []; // { dataset, message }

async function loadDataset(name, schemaFn) {
  const url = SHEET_URLS[name];
  if (!url) {
    state[name] = FALLBACK[name];
    return;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const records = parseCSVToRecords(text);
    const { rows, rowIssues } = schemaFn(records);
    state[name] = rows;
    rowIssues.forEach(msg => issues.push({ dataset: name, message: msg }));
  } catch (err) {
    console.error(`Laden van "${name}" mislukt, fallback gebruikt:`, err);
    state[name] = FALLBACK[name];
    issues.push({ dataset: name, message: `Kon niet laden uit Sheets (${err.message}), hardcoded data gebruikt.` });
  }
}

/* Per dataset: verplichte id-check + decoderen van de lastige velden.
   Een rij zonder geldige id wordt overgeslagen en gelogd; de rest
   van de dataset blijft gewoon werken. */
function mapDefinitiesRows(records) {
  const rows = [];
  const rowIssues = [];
  const seen = new Set();
  for (const r of records) {
    const id = (r.id || '').trim();
    if (!id) { rowIssues.push(`Rij zonder id overgeslagen (term: "${r.term || '?'}")`); continue; }
    if (seen.has(id)) { rowIssues.push(`Dubbele id "${id}" overgeslagen`); continue; }
    seen.add(id);
    rows.push({
      id,
      term: r.term || '',
      def: decodeText(r.def),
      ctx: decodeText(r.ctx),
      fields: decodeText(r.fields),
      cat: r.cat || '',
      team: r.team || '',
      status: r.status || '',
      date: r.date || '',
      notes: decodeText(r.notes),
      fieldChips: decodeJsonField(r.fieldChips, []),
      fieldsFull: decodeText(r.fieldsFull),
      source: r.source || '',
      changelog: decodeJsonField(r.changelog, []),
    });
  }
  return { rows, rowIssues };
}

function mapDataveldenRows(records) {
  const rows = [];
  const rowIssues = [];
  const seen = new Set();
  for (const r of records) {
    const id = (r.id || '').trim();
    if (!id) { rowIssues.push(`Rij zonder id overgeslagen (name: "${r.name || '?'}")`); continue; }
    if (seen.has(id)) { rowIssues.push(`Dubbele id "${id}" overgeslagen (eerdere rij blijft staan)`); continue; }
    seen.add(id);
    rows.push({
      id,
      name: r.name || '',
      desc: decodeText(r.desc),
      type: r.type || '',
      src: r.src || '',
      col: r.col || '',
      values: decodeText(r.values),
      ext: r.ext || '',
    });
  }
  return { rows, rowIssues };
}

function mapDashboardsRows(records) {
  const rows = [];
  const rowIssues = [];
  const seen = new Set();
  for (const r of records) {
    const id = (r.id || '').trim();
    if (!id) { rowIssues.push(`Rij zonder id overgeslagen (name: "${r.name || '?'}")`); continue; }
    if (seen.has(id)) { rowIssues.push(`Dubbele id "${id}" overgeslagen`); continue; }
    seen.add(id);
    rows.push({
      id,
      name: r.name || '',
      type: r.type || '',
      desc: decodeText(r.desc),
      loc: r.loc || '',
      team: r.team || '',
      link: r.link || '',
      updated: r.updated || '',
    });
  }
  return { rows, rowIssues };
}

/* ==================================================================
   RENDEREN
   ÉÉN centrale functie die alle drie de tabs opnieuw rendert. Wordt
   overal aangeroepen waar data verandert (init, eventueel een
   "vernieuw"-knop), zodat geen enkel scherm een oude/lege stand kan
   tonen — dat was de render-timing-bug uit het vorige traject.
   ================================================================== */
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderDefinities(filterText) {
  const list = document.getElementById('list-definities');
  const q = (filterText || '').toLowerCase();
  const items = state.definities.filter(d =>
    !q || [d.term, d.cat, d.team, d.def].join(' ').toLowerCase().includes(q)
  );
  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state">Geen definities gevonden.</div>`;
    return;
  }
  list.innerHTML = items.map(d => `
    <div class="card">
      <div class="card-top">
        <div>
          <span class="card-title">${escapeHtml(d.term)}</span>
          ${d.cat ? `<span class="badge">${escapeHtml(d.cat)}</span>` : ''}
          ${d.status ? `<span class="badge">${escapeHtml(d.status)}</span>` : ''}
        </div>
        <span class="card-id">${escapeHtml(d.id)}</span>
      </div>
      <p class="card-def">${escapeHtml(d.def)}</p>
      <div class="card-meta">
        ${d.team ? `Team: ${escapeHtml(d.team)} · ` : ''}
        ${d.date ? `Laatst bijgewerkt: ${escapeHtml(d.date)}` : ''}
      </div>
      ${d.fieldsFull ? `
        <details>
          <summary>Velden &amp; berekening</summary>
          <div class="extra-content">${escapeHtml(d.fieldsFull)}</div>
        </details>` : ''}
      ${d.ctx ? `
        <details>
          <summary>Context</summary>
          <div class="extra-content">${escapeHtml(d.ctx)}</div>
        </details>` : ''}
    </div>
  `).join('');
}

function renderDatavelden(filterText) {
  const tbody = document.getElementById('table-datavelden');
  const q = (filterText || '').toLowerCase();
  const items = state.datavelden.filter(d =>
    !q || [d.name, d.col, d.src, d.desc].join(' ').toLowerCase().includes(q)
  );
  if (items.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Geen datavelden gevonden.</td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(d => `
    <tr>
      <td>${escapeHtml(d.id)}</td>
      <td>${escapeHtml(d.name)}</td>
      <td class="cell-pre">${escapeHtml(d.desc)}</td>
      <td>${escapeHtml(d.type)}</td>
      <td>${escapeHtml(d.src)}</td>
      <td>${escapeHtml(d.col)}</td>
      <td class="cell-pre">${escapeHtml(d.values)}</td>
    </tr>
  `).join('');
}

function renderDashboards() {
  const list = document.getElementById('list-dashboards');
  if (state.dashboards.length === 0) {
    list.innerHTML = `<div class="empty-state">Geen dashboards gevonden.</div>`;
    return;
  }
  list.innerHTML = state.dashboards.map(d => `
    <div class="card">
      <div class="card-top">
        <div>
          <span class="card-title">${escapeHtml(d.name)}</span>
          ${d.type ? `<span class="badge">${escapeHtml(d.type)}</span>` : ''}
        </div>
        <span class="card-id">${escapeHtml(d.id)}</span>
      </div>
      <p class="card-def">${escapeHtml(d.desc)}</p>
      <div class="card-meta">
        ${d.team ? `Team: ${escapeHtml(d.team)} · ` : ''}
        ${d.loc ? `Locatie: ${escapeHtml(d.loc)} · ` : ''}
        ${d.updated ? `Bijgewerkt: ${escapeHtml(d.updated)}` : ''}
        ${d.link ? ` · <a class="dash-link" href="${escapeHtml(d.link)}" target="_blank" rel="noopener">Open dashboard →</a>` : ''}
      </div>
    </div>
  `).join('');
}

function renderHeaderCounts() {
  document.getElementById('header-counts').textContent =
    `${state.definities.length} begrippen · ${state.datavelden.length} velden · ${state.dashboards.length} dashboards`;
}

function renderIssueBanner() {
  const banner = document.getElementById('issue-banner');
  if (issues.length === 0) { banner.style.display = 'none'; return; }
  banner.style.display = '';
  banner.textContent = `${issues.length} rij(en) konden niet correct geladen worden — zie console voor details.`;
  console.warn('Data-issues:', issues);
}

// DE centrale hook: roept alles aan, voor alle tabs, altijd samen.
function renderAll() {
  renderHeaderCounts();
  renderIssueBanner();
  renderDefinities(document.getElementById('search-definities').value);
  renderDatavelden(document.getElementById('search-datavelden').value);
  renderDashboards();
}

/* ==================================================================
   TABS + ZOEKEN
   ================================================================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('search-definities').addEventListener('input', e => renderDefinities(e.target.value));
document.getElementById('search-datavelden').addEventListener('input', e => renderDatavelden(e.target.value));

/* ==================================================================
   OPSTARTEN
   ================================================================== */
async function init() {
  issues.length = 0;
  await Promise.all([
    loadDataset('definities', mapDefinitiesRows),
    loadDataset('datavelden', mapDataveldenRows),
    loadDataset('dashboards', mapDashboardsRows),
  ]);
  renderAll(); // één aanroep, update alle tabs — voorkomt de oude render-timing-bug
}

init();
</script>
</body>
</html>
